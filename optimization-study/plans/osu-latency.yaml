name: OSU Latency Benchmark with Flux Operator
agents:
  - path: fractale_agents.kubernetes.FluxOperatorAgent
steps:
  - name: Deploy OSU Latency
    type: agent
    tool: flux-operator
    inputs:
      goal: | 
        Discover the Kubernetes cluster resources, and deploy a MiniCluster of size 2 nodes with maximum cores available (tasks) for each node. You MUST deploy to the default namespace. Use the containerghcr.io/converged-computing/fractale-agent-experiments:osu-latency. Run osu_latency with the correct parameters. If the run is successful, parse the log and save the output matrix (for FOM). If not, keep trying to deploy until it is fixed. You MUST keep going until it executes successfully. Then run the benchmark for a total of 5 times as separate, distinct MiniClusters. After you finish, return all FOM matrices you have parsed, along with relevant reason and literature along with the chosen parameters in the format {"<param1>": <value>, "<param2>": <value>, "z", "foms": {"size-1": <value>. "size-2": <value>}, "reasons": "<logic>", "citations": "<>"} where citations are from the literature to explain the findings. You MUST set resource requests and limits to use vpc.amazonaws.com/efa: 1. }. You MUST STOP and complete the workflow after you complete 5 iterations.
