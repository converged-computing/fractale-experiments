name: Kripke run with Flux Operator
agents:
  - path: fractale_agents.kubernetes.FluxOperatorAgent
steps:
  - name: Deploy Kripke
    type: agent
    tool: flux-operator
    inputs:
      goal: | 
        Discover the Kubernetes cluster resources, and deploy a MiniCluster starting at size 1 node with maximum cores available (tasks) for that node. You MUST deploy to the default namespace. Use the container ghcr.io/converged-computing/fractale-agent-experiments:kripke. Run Kripke. You MUST maximize the final reported Grind Time Figure of Merit. Change parameters as you need, and make an effort to optimize on 1 node. If the run is successful, parse the log and get the FOM. If not, keep trying to deploy until it is fixed. You MUST keep going until it is optimized, meaning you hit a memory or other limit and scale back a little. Then scale to 2 nodes, 3 nodes, 4 nodes, and 5 nodes. After you finish with 5 nodes, return all FOMs you have parsed, along with relevant reason and literature along with the chosen X,Y, and Z in the format {"x": <value>, "y": <value>, "z", <value>, "foms": {"size-1": <value>. "size-2": <value>}, "reasons": "<logic>", "citations": "<>"} where citations are from the literature to explain the findings. You MUST pin the size after the first node and use the same problem size for subsequent experiments. You MUST set resource requests and limits to use vpc.amazonaws.com/efa: 1. }. You MUST set resource requests and limits to use vpc.amazonaws.com/efa: 1. }. The scaling study should be done once. You MUST STOP and complete the workflow after you complete 5 nodes.
