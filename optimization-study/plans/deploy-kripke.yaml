name: Kripke run with Flux Operator
agents:
  - path: fractale_agents.kubernetes.FluxOperatorAgent
steps:
  - name: Deploy Kripke
    type: agent
    tool: flux-operator
    inputs:
      goal: | 
        Discover the Kubernetes cluster resources, deploy a MiniCluster of the same number of nodes and maximum cores available to the default namespace. Use the container ghcr.io/converged-computing/fractale-agent-experiments:kripke. Run Kripke. You MUST maximize the final reported Grind Time Figure of Merit. Change parameters as you need.  If the run is successful, parse the log and get the FOM. If not, keep trying to deploy until it is fixed. Keep going until you deem optimized and return all FOMs you have parsed.
