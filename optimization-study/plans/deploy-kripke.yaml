name: Kripke run with Flux Operator
agents:
  - path: fractale_agents.kubernetes.FluxOperatorAgent
steps:
  - name: Deploy Kripke
    type: agent
    tool: flux-operator
    inputs:
      goal: | 
        Discover the Kubernetes cluster resources, and deploy a MiniCluster starting at size 1 OR 2 nodes with maximum cores available (tasks) for either size. You MUST deploy to the default namespace. Use the container ghcr.io/converged-computing/fractale-agent-experiments:kripke. Run "kripke" with --layout DGZ. Number of zones in X must evenly divide into the number of subdomains. You MUST maximize the final reported Grind Time Figure of Merit. You can choose 1 or 2 nodes to start depending on the goal. You MUST scale up to 6 nodes, and figure out problem size parameters that will afford that. Change parameters as you need, and you should first find a max zset (e.g., --zset 32,32,32) and then test different --procs orders. and make an effort to optimize on 1 OR 2 nodes. If the run is successful, parse the log and get the FOM. If not, keep trying to deploy until it is fixed. You MUST keep going until it is optimized, meaning you hit a memory or other limit and scale back a little. Then scale to even nods (e.g., 2, 4, and 6 nodes). After you finish with 6 nodes, return all FOMs you have parsed, along with relevant reason and literature along with the chosen X,Y, and Z in the format {"x": <value>, "y": <value>, "z", <value>, "foms": {"size-1": <value>. "size-2": <value>}, "reasons": "<logic>", "citations": "<>"} where citations are from the literature to explain the findings. You MUST pin the size after the first node and use the same problem size for subsequent experiments. You MUST set resource requests and limits to use vpc.amazonaws.com/efa: 1. }. You MUST set resource requests and limits to use vpc.amazonaws.com/efa: 1. }. The scaling study should be done once. You MUST STOP and complete the workflow after you complete 6 nodes. You MUST plan your execution anticipating running at 6 nodes. Please adjust parameters and OMP_NUM_THREADS as needed.
