name: LAMMPS run with Flux Operator
agents:
  - path: fractale_agents.kubernetes.FluxOperatorAgent
steps:
  - name: deploy-lammps
    type: agent
    tool: flux-operator
    inputs:
      goal: | 
        Discover the Kubernetes cluster resources, and deploy a MiniCluster starting at size 1 node with maximum cores available (tasks) for that node. Use the container ghcr.io/converged-computing/fractale-agent-experiments:lammps-reax with ghcr.io/converged-computing/flux-view-ubuntu:arm-jammy for flux.container.image and target run lmp -v x X -v y Y -v z Z -in in.reaxff.hns, where X Y and Z describe the problem size. You MUST deploy to the default namespace. It is up to you maximize the Figure of merit, k-atom or M-atom steps/s on one node. You MUST keep increasing X Y Z until the job does not complete or errors. If the run is successful, parse the log and get the FOM. If not, keep trying to deploy until it is fixed. Keep going until you deem optimized and then scale to 2 nodes, 3 nodes, 4 nodes, and 5 nodes. After you finish with 5 nodes, return all FOMs you have parsed, along with relevant reason and literature, the chosen X,Y, and Z in the format {"x": <value>, "y": <value>, "z", <value>, "foms": {"size-1": <value>. "size-2": <value>}, "reasons": "<logic>"}. You MUST pin the size after the first node and use the same problem size for subsequent experiments. You MUST set resource requests and limits to use vpc.amazonaws.com/efa: 1.

