name: LAMMPS run with Flux Operator
agents:
  - path: fractale_agents.kubernetes.FluxOperatorAgent
steps:
  - name: Deploy LAMMPS
    type: agent
    tool: flux-operator
    inputs:
      goal: | 
        Discover the Kubernetes cluster resources, deploy a MiniCluster of the same number of nodes and maximum cores available. Use the container ghcr.io/converged-computing/fractale-agent-experiments:lammps-reax and target run lmp -v x X -v y Y -v z Z -in in.reaxff.hns, where X Y and Z describe the problem size. It is up to you maximize the Figure of merit, k-atom or M-atom steps/s on one node. You MUST keep increasing X Y Z until the job does not complete or errors. If the run is successful, parse the log and get the FOM. If not, keep trying to deploy until it is fixed. Keep going until you deem optimized and return all FOMs you have parsed.
