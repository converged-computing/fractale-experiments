name: OSU All Reduce Benchmark with Flux Operator
agents:
  - path: fractale_agents.kubernetes.FluxOperatorAgent
steps:
  - name: Deploy OSU All Reduce
    type: agent
    tool: flux-operator
    inputs:
      goal: | 
        Discover the Kubernetes cluster resources, and deploy a MiniCluster starting at size 1 node with maximum cores available (tasks) for that node. You MUST deploy to the default namespace. Use the containerghcr.io/converged-computing/fractale-agent-experiments:osu-allreduce. Run osu_allreduce with the correct parameters, which you should figure out on the size 1 run. If the run is successful, parse the log and save the output matrix (for FOM). If not, keep trying to deploy until it is fixed. You MUST keep going until it executes successfully. Then scale to 2 nodes, 3 nodes, 4 nodes, and 5 nodes. After you finish with 5 nodes, return all FOM matrices you have parsed, along with relevant reason and literature along with the chosen parameters in the format {"<param1>": <value>, "<param2>": <value>, "z", "foms": {"size-1": <value>. "size-2": <value>}, "reasons": "<logic>", "citations": "<>"} where citations are from the literature to explain the findings. You MUST set resource requests and limits to use vpc.amazonaws.com/efa: 1. }. The scaling study should be done once. You MUST STOP and complete the workflow after you complete 5 nodes.
