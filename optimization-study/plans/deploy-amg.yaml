name: AMG2023 run with Flux Operator
agents:
  - path: fractale_agents.kubernetes.FluxOperatorAgent
steps:
  - name: Deploy LAMMPS
    type: agent
    tool: flux-operator
    inputs:
      goal: | 
        Discover the Kubernetes cluster resources, deploy a MiniCluster of the same number of nodes and maximum cores available to the default namespace. Use the container ghcr.io/converged-computing/fractale-agent-experiments:amg2023 and maximize the amg2023 figure of merit. You MUST maximize memory per CPU core. More cores are better. The trick to optimizing this is THREADING. You MUST force OpenMP and any math libraries to use only one thread per MPI rank. On example is setting OMP_NUM_THREADS to "1". You might also consider setting OMPI_MCA_btl_vader_single_copy_mechanism to "cma" as a conservative builder will set to none. YOU MUST SLOWLY increase the problem size, one dimension at a time, by an increment no more than double the current to increase the FOM. A timeout may not require a smaller problem size but rather a different instance. An example run that worked is amg -problem 2 -n 128 128 128 -P 8 4 1 on m7g.16xlarge with FOM 8.039496e+08. If the run is successful, parse the log and get the FOM. If not, keep trying to deploy until it is fixed. Keep going until you deem optimized and return all FOMs you have parsed. You MUST NOT oversubscribe.
