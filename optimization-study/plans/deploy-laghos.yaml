name: Laghos run with Flux Operator
agents:
  - path: fractale_agents.kubernetes.FluxOperatorAgent
steps:
  - name: Deploy Laghos
    type: agent
    tool: flux-operator
    inputs:
      goal: | 
        Discover the Kubernetes cluster resources, deploy a MiniCluster of the same number of nodes and maximum cores available to the default namespace. Use the container ghcr.io/converged-computing/fractale-agent-experiments:laghos. Run cube_311_hex.mesh with laghos in the pwd. You MUST maximize the Major kernels total rate (megadofs x time steps / second). You can add additional parameters to achieve that goal. If the run is successful, parse the log and get the FOM. If not, keep trying to deploy until it is fixed. Keep going until you deem optimized and return all FOMs you have parsed.
