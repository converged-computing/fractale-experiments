name: Laghos run with Flux Operator
agents:
  - path: fractale_agents.kubernetes.FluxOperatorAgent
steps:
  - name: Deploy Laghos
    type: agent
    tool: flux-operator
    inputs:
      goal: | 
        Discover the Kubernetes cluster resources, and deploy a MiniCluster starting at size 1 node with maximum cores available (tasks) for that node. You MUST deploy to the default namespace. Use the container ghcr.io/converged-computing/fractale-agent-experiments:laghos. Run cube_311_hex.mesh with laghos in the pwd with 400 --max-steps. You MUST maximize the Major kernels total rate (megadofs x time steps / second). You can add additional parameters to achieve that goal. If the run is successful, parse the log and get the FOM. If not, keep trying to deploy until it is fixed. You MUST keep going until it is optimized, meaning you hit a memory or other limit and scale back a little. Then scale to 2 nodes, 3 nodes, 4 nodes, and 5 nodes. After you finish with 5 nodes, return all FOMs you have parsed, along with relevant reason and literature along with the chosen parameters in the format {"<param1>": <value>, "<param2>": <value>, "z", "foms": {"size-1": <value>. "size-2": <value>}, "reasons": "<logic>", "citations": "<>"} where citations are from the literature to explain the findings. You MUST pin the size after the first node and use the same problem size for subsequent experiments. You MUST set resource requests and limits to use vpc.amazonaws.com/efa: 1. }. The scaling study should be done once. You MUST STOP and complete the workflow after you complete 5 nodes.

