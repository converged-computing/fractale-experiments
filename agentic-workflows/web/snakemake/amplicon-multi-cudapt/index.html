<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakemake Agent Dashboard - Variant Calling</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 0.9rem; background: #f8f9fa; }
        .sidebar { height: 100vh; background: #212529; color: white; overflow-y: auto; padding-top: 20px; }
        .run-link { padding: 10px 20px; color: #adb5bd; cursor: pointer; border-bottom: 1px solid #343a40; }
        .run-link:hover { background: #343a40; color: white; }
        .run-link.active { background: #0d6efd; color: white; }
        .status-success { color: #198754; font-weight: bold; }
        .status-failure { color: #dc3545; font-weight: bold; }
        .card { margin-bottom: 20px; border: none; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); }
        pre { background: #f1f1f1; padding: 15px; border-radius: 5px; font-size: 0.8rem; }
        .metric-val { font-size: 1.2rem; font-weight: bold; display: block; }
        .metric-label { font-size: 0.7rem; text-transform: uppercase; color: #6c757d; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 p-0 sidebar" id="sidebar">
                <h5 class="px-3 mb-3 text-white">Agent Runs</h5>
                <div id="run-list"></div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4" id="main-content">
                <div id="empty-state" class="text-center mt-5">
                    <h3>Select a run from the sidebar to view details</h3>
                </div>

                <div id="detail-view" style="display:none;">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 id="view-id">Run Details</h2>
                        <span id="view-status" class="badge p-2">STATUS</span>
                    </div>

                    <div class="row">
                        <!-- Metrics -->
                        <div class="col-md-3">
                            <div class="card p-3 text-center">
                                <span class="metric-label">Turns</span>
                                <span class="metric-val" id="m-turns">-</span>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3 text-center">
                                <span class="metric-label">Total Tokens</span>
                                <span class="metric-val" id="m-tokens">-</span>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3 text-center">
                                <span class="metric-label">Prompt Tokens</span>
                                <span class="metric-val" id="m-prompt">-</span>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3 text-center">
                                <span class="metric-label">Thought Tokens</span>
                                <span class="metric-val" id="m-thought">-</span>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header bg-white font-weight-bold">Summary</div>
                        <div class="card-body">
                            <p id="view-summary" class="lead"></p>
                            <h6>Reasoning:</h6>
                            <p id="view-reason" class="text-muted italic"></p>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header bg-white">Issues Encountered</div>
                                <div class="card-body">
                                    <ul id="view-issues" class="list-group list-group-flush"></ul>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header bg-white">Steps Executed</div>
                                <div class="card-body">
                                    <ul id="view-steps" class="list-group list-group-flush"></ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header bg-white">Token Usage Over Time</div>
                        <div class="card-body">
                            <canvas id="tokenChart" height="100"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
