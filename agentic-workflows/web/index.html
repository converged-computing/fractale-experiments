<!DOCTYPE html>
<html>
<head>
    <title>Snakemake Steps Graph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; overflow: hidden; background: #1a1a1a; color: white; }
        canvas { cursor: move; }
        .controls { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; pointer-events: all; }
        input { background: #333; color: white; border: 1px solid #555; padding: 5px; width: 200px; }
        .tooltip { position: absolute; background: white; color: black; padding: 5px; border-radius: 3px; pointer-events: none; opacity: 0; font-size: 12px; }
    </style>
</head>
<body>
    <div class="controls">
        <h3>Connected Steps</h3>
        <input type="text" id="search" placeholder="Search for a tool (e.g. bwa)...">
        <p><small>Scroll to zoom, drag to pan. <br>Hover nodes to see full paths.</small></p>
    </div>
    <div id="tooltip" class="tooltip"></div>
    <svg id="viz"></svg>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#viz")
            .attr("width", width)
            .attr("height", height)
            .call(d3.zoom().on("zoom", (event) => g.attr("transform", event.transform)))
            .append("g");

        const g = svg.append("g");
        
        d3.json("graph_data.json").then(data => {
            const nodes = data.nodes;
            const links = data.links;

            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(100))
                .force("charge", d3.forceManyBody().strength(-150))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("x", d3.forceX(width / 2).strength(0.05))
                .force("y", d3.forceY(height / 2).strength(0.05));

            const link = g.append("g")
                .selectAll("line")
                .data(links)
                .join("line")
                .attr("stroke", "#555")
                .attr("stroke-opacity", 0.6)
                .attr("stroke-width", d => Math.sqrt(d.weight || 1) + 1);

         svg.append("defs").append("marker")
             .attr("id", "arrowhead")
             .attr("viewBox", "-0 -5 10 10")
             .attr("refX", 20)
             .attr("refY", 0)
             .attr("orient", "auto")
             .attr("markerWidth", 4)
             .attr("markerHeight", 4)
             .attr("xoverflow", "visible")
             .append("svg:path")
             .attr("d", "M 0,-5 L 10 ,0 L 0,5")
             .attr("fill", "#666")
             .style("stroke", "none");

            link.attr("marker-end", "url(#arrowhead)");

            const color = d3.scaleOrdinal(d3.schemeCategory10);

            const node = g.append("g")
                .selectAll("circle")
                .data(nodes)
                .join("circle")
                .attr("r", 8)
                .attr("fill", d => color(d.group))
                .attr("stroke", "#fff")
                .attr("stroke-width", 1.5)
                .call(drag(simulation));

            const label = g.append("g")
                .selectAll("text")
                .data(nodes)
                .join("text")
                .text(d => d.id.split('/').pop()) // Only show tool name, not full path
                .attr("font-size", "10px")
                .attr("dx", 12)
                .attr("dy", 4)
                .attr("fill", "#ccc")
                .style("pointer-events", "none");

            // Tooltip and Search
            node.on("mouseover", (e, d) => {
                d3.select("#tooltip").style("opacity", 1).html(d.id).style("left", (e.pageX + 10) + "px").style("top", (e.pageY - 10) + "px");
            }).on("mouseout", () => d3.select("#tooltip").style("opacity", 0));

            d3.select("#search").on("input", function() {
                const term = this.value.toLowerCase();
                node.attr("fill", d => d.id.toLowerCase().includes(term) && term !== "" ? "red" : color(d.group))
                    .attr("r", d => d.id.toLowerCase().includes(term) && term !== "" ? 12 : 8);
            });

            simulation.on("tick", () => {
                link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                node.attr("cx", d => d.x).attr("cy", d => d.y);
                label.attr("x", d => d.x).attr("y", d => d.y);
            });

            function drag(simulation) {
                return d3.drag()
                    .on("start", (event) => {
                        if (!event.active) simulation.alphaTarget(0.3).restart();
                        event.subject.fx = event.subject.x;
                        event.subject.fy = event.subject.y;
                    })
                    .on("drag", (event) => {
                        event.subject.fx = event.x;
                        event.subject.fy = event.y;
                    })
                    .on("end", (event) => {
                        if (!event.active) simulation.alphaTarget(0);
                        event.subject.fx = null;
                        event.subject.fy = null;
                    });
            }
        });
    </script>
</body>
</html>
