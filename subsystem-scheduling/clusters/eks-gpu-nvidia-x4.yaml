apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: sched-eks-gpu-nvidia-x4
  region: us-east-1
  version: "1.30"
managedNodeGroups:
  - name: gpu
    instanceType: g5.12xlarge                 # GPU nodes use the default managed GPU AMI
    desiredCapacity: 2
    minSize: 0
    maxSize: 2
