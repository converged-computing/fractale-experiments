# Graviton3E + EFA. EFA is NOT installed by the managed AMI on its own — it is
# enabled here with efaEnabled, which is what pulls in the EFA device support.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: sched-eks-arm-efa
  region: us-east-2
  version: "1.30"
managedNodeGroups:
  - name: hpc7g
    instanceType: hpc7g.4xlarge      # Graviton3E (arm64), 128 GiB, 200G EFA
    desiredCapacity: 5
    minSize: 0
    maxSize: 5
    efaEnabled: true
    privateNetworking: true
    placement:
      groupName: sched-arm-efa-pg
