# arm64 (Graviton2) + EFA. c6gn.16xlarge rather than hpc7g.4xlarge: hpc7g is
# offered in a single zone here and its nodegroup failed to come up twice, while
# c6gn is EFA capable and available across zones. No placement group: a cluster
# placement group in one zone is another way for capacity to fail.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: sched-eks-arm-efa
  region: us-east-1
managedNodeGroups:
  - name: graviton-efa
    instanceType: c6gn.16xlarge      # Graviton2 (arm64), 128 GiB, 100G EFA
    desiredCapacity: 2
    minSize: 0
    maxSize: 2
    efaEnabled: true
    privateNetworking: true
