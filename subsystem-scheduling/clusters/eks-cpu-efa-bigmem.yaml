# amd64, 256 GiB, no EFA. r7i supports EFA only at 48xlarge, and m5n.24xlarge
# did not come up either; the fabric dimension is covered by the c6gn cluster, so
# this one exists purely for the top memory bucket that nothing else reaches.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: sched-eks-cpu-efa-bigmem
  region: us-east-1
managedNodeGroups:
  - name: bigmem
    instanceType: m7i.4xlarge     # amd64, 16 vCPU = 8 physical cores, 64 GiB
    desiredCapacity: 3
    minSize: 3
    maxSize: 3
    efaEnabled: false
    privateNetworking: true
