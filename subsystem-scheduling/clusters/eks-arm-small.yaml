# Cheapest real arm64 cluster, for validating the workflow before the full fleet.
# No EFA (that needs hpc7g/c7gn and a placement group) — this exists purely to make
# `architecture` a discriminating dimension alongside the amd64 GKE cluster.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: sched-eks-arm-small
  region: us-east-1
managedNodeGroups:
  - name: graviton
    instanceType: c7g.2xlarge     # arm64, 8 vCPU = 8 physical cores, 16 GiB
    desiredCapacity: 3
    minSize: 3
    maxSize: 3
