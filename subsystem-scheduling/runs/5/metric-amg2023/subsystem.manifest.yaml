apiVersion: flux-framework.org/v1alpha2
kind: MiniCluster
metadata:
  name: metric-amg2023-job-0016
spec:
  size: 2
  tasks: 0
  flux:
    container:
      image: ghcr.io/converged-computing/flux-view-ubuntu:jammy
      pullAlways: true
  containers:
    - image: ghcr.io/converged-computing/amg2023:ubuntu2204-intel-mpi
      launcher: true
      command: "flux-secretary run --nodes 2 --attempts 10 --model us.anthropic.claude-opus-5 -- amg -problem 2 -n 96 96 96 -iter 5"
      commands:
        pre: |
          /mnt/flux/view/bin/python3.14 -m ensurepip
          /mnt/flux/view/bin/python3.14 -m pip install --no-cache-dir flux-secretary[all]
      volumes:
        secretary-token:
          path: /etc/flux-secretary
          secretName: flux-secretary-token
