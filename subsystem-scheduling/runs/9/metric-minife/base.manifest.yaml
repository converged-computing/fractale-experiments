apiVersion: flux-framework.org/v1alpha2
kind: MiniCluster
metadata:
  name: metric-minife-job-0187
spec:
  size: 2
  tasks: 0
  flux:
    container:
      image: ghcr.io/converged-computing/flux-view-ubuntu:jammy
      pullAlways: true
  containers:
    - image: ghcr.io/converged-computing/metric-minife:libfabric-cpu
      launcher: true
      command: "flux-secretary run --nodes 2 --attempts 10 --model us.anthropic.claude-opus-5 -- miniFE.x -nx 16 -ny 16 -nz 16"
      commands:
        pre: |
          /mnt/flux/view/bin/python3.14 -m ensurepip
          /mnt/flux/view/bin/python3.14 -m pip install --no-cache-dir flux-secretary[all]
      volumes:
        secretary-token:
          path: /etc/flux-secretary
          secretName: flux-secretary-token
