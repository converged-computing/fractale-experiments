apiVersion: flux-framework.org/v1alpha2
kind: MiniCluster
metadata:
  name: metric-quicksilver-cpu-job-0034
spec:
  size: 2
  tasks: 0
  flux:
    container:
      image: ghcr.io/converged-computing/flux-view-ubuntu:jammy
      pullAlways: true
  containers:
    - image: ghcr.io/converged-computing/metric-quicksilver-cpu:libfabric-zen4
      launcher: true
      command: "flux-secretary run --nodes 2 --attempts 10 --model us.anthropic.claude-opus-5 -- qs -i /opt/quicksilver/Examples/CORAL2_Benchmark/Problem1/Coral2_P1.inp -X 4 -Y 4 -Z 4 -x 4 -y 4 -z 4 -n 1000 -N 1"
      commands:
        pre: |
          /mnt/flux/view/bin/python3.14 -m ensurepip
          /mnt/flux/view/bin/python3.14 -m pip install --no-cache-dir flux-secretary[all]
      volumes:
        secretary-token:
          path: /etc/flux-secretary
          secretName: flux-secretary-token
