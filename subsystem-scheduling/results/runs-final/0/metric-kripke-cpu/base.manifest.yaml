apiVersion: flux-framework.org/v1alpha2
kind: MiniCluster
metadata:
  name: metric-kripke-cpu-job-0001
spec:
  size: 2
  tasks: 0
  flux:
    container:
      image: ghcr.io/converged-computing/flux-view-ubuntu:jammy
      pullAlways: true
  containers:
    - image: ghcr.io/converged-computing/metric-kripke-cpu:libfabric
      launcher: true
      command: "flux-secretary run --nodes 2 --attempts 10 --model us.anthropic.claude-opus-5 -- kripke --layout DGZ --nest DGZ --zones 8,8,8 --procs 1,1,1 --groups 2 --legendre 1 --quad 4 --niter 1"
      commands:
        pre: |
          /mnt/flux/view/bin/python3.14 -m ensurepip
          /mnt/flux/view/bin/python3.14 -m pip install --no-cache-dir flux-secretary[all]
      volumes:
        secretary-token:
          path: /etc/flux-secretary
          secretName: flux-secretary-token
