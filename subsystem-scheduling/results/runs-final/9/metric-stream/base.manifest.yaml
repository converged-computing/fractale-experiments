apiVersion: flux-framework.org/v1alpha2
kind: MiniCluster
metadata:
  name: metric-stream-job-0035
spec:
  size: 2
  tasks: 0
  flux:
    arch: "arm"
    container:
      image: ghcr.io/converged-computing/flux-view-ubuntu:jammy-arm
      pullAlways: true
  containers:
    - image: ghcr.io/converged-computing/metric-stream:cpu
      launcher: true
      command: "flux-secretary run --nodes 2 --attempts 10 --model us.anthropic.claude-opus-5 -- stream_c.exe"
      commands:
        pre: |
          /mnt/flux/view/bin/python3.14 -m ensurepip
          /mnt/flux/view/bin/python3.14 -m pip install --no-cache-dir flux-secretary[all]
      volumes:
        secretary-token:
          path: /etc/flux-secretary
          secretName: flux-secretary-token
